name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & publish signed release
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      - name: Verify tag matches versionName
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TAG_VER="${TAG#v}"
          GRADLE_VER="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)"
          echo "tag=$TAG tag_version=$TAG_VER gradle_versionName=$GRADLE_VER"
          if [ "$TAG_VER" != "$GRADLE_VER" ]; then
            echo "::error::Tag $TAG does not match app/build.gradle.kts versionName $GRADLE_VER. Bump versionName (or fix the tag) and re-run /release."
            exit 1
          fi
          echo "VERSION_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Build release APKs
        run: |
          set -euo pipefail
          ./gradlew assembleRelease -Penable-updater --console=plain 2>&1 | tee build_release.log
          python3 tools/ci/report-release-warnings.py build_release.log --enforce

      - name: Upload unsigned APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arm64-v8a-${{ env.VERSION_TAG }}
          path: app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk

      - name: Upload mapping artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mapping-${{ env.VERSION_TAG }}
          path: app/build/outputs/mapping/release

      - name: Sign APKs
        uses: r0adkll/sign-android-release@f30bdd30588842ac76044ecdbd4b6d0e3e813478
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Rename signed APKs and collect checksums
        run: |
          set -e

          mv app/build/outputs/apk/release/app-universal-release-unsigned-signed.apk mugen-${{ env.VERSION_TAG }}.apk
          sha=`sha256sum mugen-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }'`
          echo "APK_UNIVERSAL_SHA=$sha" >> $GITHUB_ENV

          mv app/build/outputs/apk/release/app-arm64-v8a-release-unsigned-signed.apk mugen-arm64-v8a-${{ env.VERSION_TAG }}.apk
          sha=`sha256sum mugen-arm64-v8a-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }'`
          echo "APK_ARM64_V8A_SHA=$sha" >> $GITHUB_ENV

          mv app/build/outputs/apk/release/app-armeabi-v7a-release-unsigned-signed.apk mugen-armeabi-v7a-${{ env.VERSION_TAG }}.apk
          sha=`sha256sum mugen-armeabi-v7a-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }'`
          echo "APK_ARMEABI_V7A_SHA=$sha" >> $GITHUB_ENV

          mv app/build/outputs/apk/release/app-x86-release-unsigned-signed.apk mugen-x86-${{ env.VERSION_TAG }}.apk
          sha=`sha256sum mugen-x86-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }'`
          echo "APK_X86_SHA=$sha" >> $GITHUB_ENV

          mv app/build/outputs/apk/release/app-x86_64-release-unsigned-signed.apk mugen-x86_64-${{ env.VERSION_TAG }}.apk
          sha=`sha256sum mugen-x86_64-${{ env.VERSION_TAG }}.apk | awk '{ print $1 }'`
          echo "APK_X86_64_SHA=$sha" >> $GITHUB_ENV

      - name: Build release notes
        run: |
          set -euo pipefail
          python3 tools/ci/extract-changelog-section.py "${{ env.VERSION_TAG }}" CHANGELOG.md > release_body.md
          {
            printf '\n---\n\n'
            printf '### Checksums\n\n'
            printf '| Variant | SHA-256 |\n'
            printf '| ------- | ------- |\n'
            printf '| Universal | %s |\n' "${{ env.APK_UNIVERSAL_SHA }}"
            printf '| arm64-v8a | %s |\n' "${{ env.APK_ARM64_V8A_SHA }}"
            printf '| armeabi-v7a | %s |\n' "${{ env.APK_ARMEABI_V7A_SHA }}"
            printf '| x86 | %s |\n' "${{ env.APK_X86_SHA }}"
            printf '| x86_64 | %s |\n' "${{ env.APK_X86_64_SHA }}"
          } >> release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: Mugen ${{ env.VERSION_TAG }}
          body_path: release_body.md
          files: |
            mugen-${{ env.VERSION_TAG }}.apk
            mugen-arm64-v8a-${{ env.VERSION_TAG }}.apk
            mugen-armeabi-v7a-${{ env.VERSION_TAG }}.apk
            mugen-x86-${{ env.VERSION_TAG }}.apk
            mugen-x86_64-${{ env.VERSION_TAG }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
